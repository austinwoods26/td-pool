name: Weekly Admin Report

on:
  schedule:
    - cron: "0 21 * * 2"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly report
        run: |
          curl -sS -f -L -X GET "https://www.thetdpool.com/api/admin-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP Status: %{http_code}\n"
